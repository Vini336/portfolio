<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Clash Manager PRO</title>

<style>
body {
  font-family: Arial;
  background:#0f172a;
  color:white;
  padding:20px;
}

.topo {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:20px;
}

h1 {
  width:100%;
}

select, button {
  padding:10px;
  border-radius:6px;
  border:none;
  font-weight:bold;
}

button {
  background:#2563eb;
  color:white;
  cursor:pointer;
}

button:hover {
  background:#1d4ed8;
}

#contador {
  margin:15px 0;
  font-size:18px;
  font-weight:bold;
}

.barra-container {
  background:#334155;
  border-radius:10px;
  height:20px;
  margin-bottom:20px;
}

#barra {
  background:#22c55e;
  height:100%;
  width:0%;
  border-radius:10px;
}

.item {
  background:#1e293b;
  padding:12px;
  border-radius:10px;
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

.nivel {
  color:#22c55e;
  font-weight:bold;
}

.info {
  font-size:12px;
  color:#94a3b8;
}
</style>
</head>

<body>

<h1>🏰 Clash Manager PRO</h1>

<div class="topo">
  <select onchange="mudarCV(this.value)">
    <option value="13">CV13</option>
  </select>

  <button onclick="gerar()">Gerar</button>
  <button onclick="resetar()">Resetar</button>
  <button onclick="toggleFiltro()">Só faltam</button>
</div>

<h2 id="contador"></h2>

<div class="barra-container">
  <div id="barra"></div>
</div>

<div id="lista"></div>

<script src="database.js"></script>
<script src="app.js"></script>

</body>
</html>
