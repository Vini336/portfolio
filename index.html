<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clash Manager PRO</title>

<style>
body {
  font-family: Arial;
  background:#0f172a;
  color:white;
  padding:10px;
  margin:0;
}

h1 {
  font-size:20px;
  margin-bottom:10px;
}

.topo {
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-bottom:15px;
}

.topo button, .topo select {
  width:100%;
}

select, button {
  padding:12px;
  border-radius:8px;
  border:none;
  font-weight:bold;
  font-size:14px;
}

button {
  background:#2563eb;
  color:white;
}

#contador {
  font-size:14px;
  margin:10px 0;
}

.barra-container {
  background:#334155;
  border-radius:10px;
  height:15px;
  margin-bottom:15px;
}

#barra {
  background:#22c55e;
  height:100%;
  width:0%;
  border-radius:10px;
}

.item {
  background:#1e293b;
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
}

.item-top {
  display:flex;
  align-items:center;
  gap:10px;
}

.item-buttons {
  display:flex;
  gap:5px;
  margin-top:10px;
}

.item-buttons button {
  flex:1;
  padding:12px;
  font-size:16px;
}

.nivel {
  color:#22c55e;
  font-weight:bold;
}

.info {
  font-size:12px;
  color:#94a3b8;
}
</style>
</head>

<body>

<h1>🏰 Clash Manager PRO</h1>

<div class="topo">
  <select onchange="mudarCV(this.value)">
    <option value="13">CV13</option>
  </select>

  <button onclick="gerar()">Gerar</button>
  <button onclick="resetar()">Resetar</button>
  <button onclick="toggleFiltro()">Só faltam</button>
</div>

<h2 id="contador"></h2>

<div class="barra-container">
  <div id="barra"></div>
</div>

<div id="lista"></div>

<script src="database.js"></script>
<script src="app.js"></script>

</body>
</html>
